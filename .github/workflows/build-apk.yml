name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: 🏗 Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🏗 Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build Android APK
        run: |
          cd android && ./gradlew assembleRelease
          # Note: If this is an Expo project without 'android' folder, 
          # we run 'npx expo prebuild' first.
        # Replacing the above standard run with Expo specific one:
      
      - name: 🛠 Expo Prebuild (Generate Android Folder)
        run: npx expo prebuild --platform android --clean

      - name: 🚀 Build APK using Gradle
        run: |
          cd android
          ./gradlew assembleRelease

      - name: 📤 Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
